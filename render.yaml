services:
  - type: web
    name: titanic-survival-prediction
    env: python-3.12
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.enableCORS false --server.headless true"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
